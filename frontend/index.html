  <body>
    <div id="root">
      <!-- Splash screen shown while React boots -->
      <style>
        .splash-screen {
          position: fixed;
          top: 0; left: 0; right: 0; bottom: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: radial-gradient(600px 400px at 50% 30%, rgba(170, 204, 0, 0.14), transparent 60%), linear-gradient(160deg, #007f5f 0%, #004634 70%);
          font-family: 'Plus Jakarta Sans', sans-serif;
          z-index: 9999;
          transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .splash-logo-container {
          position: relative;
          width: 96px;
          height: 96px;
          display: flex;
          align-items: center;
          justify-content: center;
          margin-bottom: 2rem;
          filter: drop-shadow(0 18px 40px rgba(0, 0, 0, 0.4)) drop-shadow(0 0 30px rgba(170, 204, 0, 0.35));
          animation: splash-float 2.4s ease-in-out infinite;
        }
        .splash-logo {
          width: 96px;
          height: 96px;
        }
        .splash-brand {
          font-size: 1.5rem;
          font-weight: 800;
          color: #ffffff;
          letter-spacing: -0.02em;
          margin: 0;
        }
        .splash-tag {
          margin-top: 0.3rem;
          font-size: 0.65rem;
          font-weight: 700;
          color: #aacc00;
          letter-spacing: 0.22em;
          text-transform: uppercase;
        }
        .splash-text {
          margin-top: 0.75rem;
          font-size: 0.875rem;
          font-weight: 500;
          color: rgba(255, 255, 255, 0.7);
          letter-spacing: 0.02em;
        }
        @keyframes splash-float {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-6px); }
        }
      </style>
      <div class="splash-screen" id="app-splash">
        <div class="splash-logo-container">
          <svg class="splash-logo" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="splashg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#55a630"/><stop offset=".55" stop-color="#007f5f"/><stop offset="1" stop-color="#004634"/></linearGradient></defs><rect x="2" y="2" width="60" height="60" rx="17" fill="url(#splashg)"/><rect x="2.75" y="2.75" width="58.5" height="58.5" rx="16" fill="none" stroke="#aacc00" stroke-opacity=".4" stroke-width="1.5"/><path d="M32 47V30" stroke="#e7f4d2" stroke-width="4.2" stroke-linecap="round"/><path d="M32 37.5C24.8 37.5 19.3 32.8 18.3 24.6 26.3 25.6 31 30.2 32 37.5Z" fill="#aacc00"/><path d="M32 32.5C39.2 32.5 44.7 27.8 45.7 19.6 37.7 20.6 33 25.2 32 32.5Z" fill="#e7f4d2"/><path d="M22 50.5Q32 54.5 42 50.5" stroke="#aacc00" stroke-width="3.4" fill="none" stroke-linecap="round"/></svg>
        </div>
        <h2 class="splash-brand">EcoSankalan</h2>
        <p class="splash-tag">Go Green Daily</p>
        <p class="splash-text">Growing your green space...</p>
      </div>
    </div>
