<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/logo.png?v=2" />
    <link rel="apple-touch-icon" href="/logo-192.png?v=2" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EcoSankalan — log waste, find nearby bins, join clean-up events and earn eco rewards." />
    <meta name="theme-color" content="#2A7C13" />
    <title>EcoSankalan — Go Green Daily</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" crossorigin=""/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" crossorigin=""/>
    <!-- TODO: bundle Leaflet via npm imports and drop this CDN script to enable offline + avoid version drift. Currently pages use window.L. -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  </head>
  <body>
    <div id="root">
      <!-- Splash screen shown while React boots -->
      <style>
        .splash-screen {
          position: fixed;
          top: 0; left: 0; right: 0; bottom: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: radial-gradient(600px 400px at 50% 30%, rgba(118, 196, 87, 0.22), transparent 60%), linear-gradient(160deg, #2A7C13 0%, #1C5410 70%);
          font-family: 'Plus Jakarta Sans', sans-serif;
          z-index: 9999;
          transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .splash-logo-container {
          position: relative;
          width: 96px;
          height: 96px;
          display: flex;
          align-items: center;
          justify-content: center;
          margin-bottom: 2rem;
          filter: drop-shadow(0 18px 40px rgba(0, 0, 0, 0.4)) drop-shadow(0 0 30px rgba(118, 196, 87, 0.4));
          animation: splash-float 2.4s ease-in-out infinite;
        }
        .splash-logo {
          width: 112px;
          height: 112px;
          object-fit: contain;
        }
        .splash-brand {
          font-size: 1.5rem;
          font-weight: 800;
          color: #ffffff;
          letter-spacing: -0.02em;
          margin: 0;
        }
        .splash-tag {
          margin-top: 0.3rem;
          font-size: 0.65rem;
          font-weight: 700;
          color: #76C457;
          letter-spacing: 0.22em;
          text-transform: uppercase;
        }
        .splash-text {
          margin-top: 0.75rem;
          font-size: 0.875rem;
          font-weight: 500;
          color: rgba(255, 255, 255, 0.7);
          letter-spacing: 0.02em;
        }
        @keyframes splash-float {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-6px); }
        }
      </style>
      <div class="splash-screen" id="app-splash">
        <div class="splash-logo-container">
          <img class="splash-logo" src="/logo.png" alt="EcoSankalan logo" />
        </div>
        <h2 class="splash-brand">EcoSankalan</h2>
        <p class="splash-tag">Go Green Daily</p>
        <p class="splash-text">Growing your green space...</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
